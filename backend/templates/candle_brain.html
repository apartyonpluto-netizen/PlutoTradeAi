{% extends "base.html" %}
{% block title %}PlutoTrade AI · Candle Brain{% endblock %}
{% block content %}
<section class="panel" data-analysis-section="{{ analysis_section }}" data-analysis-empty-label="No Candle Signals - add a ticker below.">
    <div class="panel-head">
        <h3>Candle Brain</h3>
        <span data-analysis-live-badge>Live updates every 8s</span>
    </div>
    <div data-analysis-errors></div>

    <div class="analysis-list-editor" data-analysis-chips></div>
    <form class="ticker-add-form" data-analysis-add-form>
        <input type="text" name="ticker" placeholder="Add ticker" maxlength="8" required>
        <button type="submit" class="ghost-button">Add</button>
    </form>
    <p class="analysis-cap-note" data-analysis-cap-note></p>

    <div class="price-map-list" data-analysis-rows>
        <p class="muted">Loading candle signals...</p>
    </div>
</section>

<section class="panel analysis-suggestions">
    <div class="panel-head"><h3>AI Suggestions</h3><span>Scanner-driven picks not already in this list</span></div>
    <div data-analysis-suggestions>
        <p class="muted">Loading suggestions...</p>
    </div>
</section>
{% endblock %}
