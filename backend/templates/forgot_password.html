<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlutoTrade AI · Reset Password</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#020105">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PlutoTrade">
</head>
<body>
<div class="bg-space" aria-hidden="true"></div>
<div class="bg-stars" aria-hidden="true"></div>
<div class="bg-nebula" aria-hidden="true"></div>
<div class="bg-planets" aria-hidden="true"></div>
<div class="bg-warp" aria-hidden="true"></div>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-brand-mark" aria-hidden="true"></div>
            <div>
                <h1>PlutoTrade AI</h1>
                <span>Captain Curtis</span>
            </div>
        </div>
        <h2>Reset password</h2>
        <p class="muted">Enter your username and choose a new password. There's no email recovery configured yet, so this only checks your username.</p>
        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}
        {% if success %}
        <div class="auth-success">{{ success }}</div>
        {% endif %}
        <form method="POST" action="/forgot-password">
            <div class="auth-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="auth-field">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
            </div>
            <div class="auth-field">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" class="auth-submit">Reset Password</button>
        </form>
        <p class="auth-switch"><a href="/login">Back to sign in</a></p>
    </div>
</div>
</body>
</html>
