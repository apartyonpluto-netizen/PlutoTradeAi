services:
  - type: web
    name: plutotradeai
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    # --worker-class gthread --threads 3 (added 2026-08-28, was plain sync):
    # found live that a Preview Scan (20-40s of blocking work - market scan
    # plus per-ticker intelligence - inside a single request) could tie up
    # a whole gunicorn sync worker process for that entire span. With only
    # 4 sync workers total, that's real exposure - if the other 3 happen to
    # be busy with anything else at the same moment (another user's page
    # load, the continuous-monitor-tick poller that hits this same service
    # every ~10s), Render's own /healthz check has nowhere to land and can
    # time out, which is exactly what happened: a genuine "Instance failed:
    # HTTP health check failed" + restart landed seconds after a Preview
    # Scan run, confirmed via Render's own Events/logs. gthread gives each
    # of the 4 WORKER PROCESSES its own small pool of THREADS, so a slow
    # scan occupying one thread no longer blocks /healthz (or any other
    # quick request) from being served by another thread in that same
    # process. Kept to 3 threads/worker (12 total slots, up from 4) rather
    # than something larger - this plan is 1 CPU, so threads buy real
    # concurrency here only because the slow paths are I/O-bound (network
    # calls, future.result() waits, both of which release the GIL), not
    # CPU parallelism, and a small multiplier avoids materially raising the
    # worst-case concurrent-scan memory footprint after the 2026-08-25 OOM
    # history on this same 2GB plan. Verified this doesn't reintroduce a
    # concurrency bug: the shared mutable state actually touched under
    # request handling (per-user accounts.json via _accounts_file_lock,
    # webull.py's _trade_client_cache) is already either OS-level
    # fcntl.flock'd (correct across threads AND processes, not just
    # processes) or protected by its own threading.Lock - see those
    # modules' own docstrings.
    startCommand: gunicorn --chdir backend app:app --workers 4 --worker-class gthread --threads 3 --timeout 90 --preload
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      - key: PLUTO_DATA_DIR
        value: /var/data
      - key: FORCE_SECURE_COOKIES
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      # Shared with the plutotradeai-continuous-monitor worker below - both
      # sides must have the IDENTICAL value. sync: false (not generateValue)
      # because Render's Blueprint spec has no way to generate a secret once
      # and share it across two services - it must be set by hand, once, on
      # each service, in the Render dashboard. See that worker's own
      # envVars block for the matching entry.
      - key: MONITOR_WORKER_SECRET
        sync: false
    disk:
      name: plutotradeai-data
      mountPath: /var/data
      sizeGB: 1

  # Option A from the architecture review (see conversation history): a
  # separate, independently-deployed background worker with NO disk access
  # and NO Webull credentials, calling the web service's own authenticated
  # /api/autonomy/continuous-monitor-tick endpoint on a tight sequential
  # loop every ~10 seconds so reconciliation runs on the web service, which
  # already owns the disk/credentials. See backend/continuous_monitor_worker.py's
  # own module docstring for the full reasoning (a background thread inside
  # gunicorn was explicitly rejected: it can die silently while the site
  # stays healthy).
  - type: worker
    name: plutotradeai-continuous-monitor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/continuous_monitor_worker.py
    envVars:
      - key: MONITOR_ENDPOINT_URL
        value: https://plutotradeai-tqsl.onrender.com/api/autonomy/continuous-monitor-tick
      - key: MONITOR_WORKER_SECRET
        sync: false
      - key: MONITOR_INTERVAL_SECONDS
        value: "10"

  # Replaces .github/workflows/autonomous-scan-scheduler.yml as the
  # PRIMARY trigger for the full 5-minute scan that places new autonomous
  # entries - found live 2026-08-28 that GitHub's scheduled-workflow
  # mechanism is best-effort and unreliable at this cadence: real GitHub
  # Actions run history showed runs landing hours apart instead of every
  # 5 minutes, then stopping entirely for 22+ hours (confirmed NOT a
  # billing/quota issue - GitHub's own Actions minutes usage showed
  # 0/2000 consumed for the period). This is exactly what
  # api_autonomy_cron_trigger's own docstring in app.py already
  # anticipated - "Called on a timer by a Render Cron Job (or,
  # currently, a GitHub Actions schedule...)" - a Render Cron Job is a
  # first-party scheduled-invocation primitive on the SAME
  # infrastructure as the web service itself, not a cross-platform
  # best-effort trigger. The GitHub Actions workflow is deliberately
  # left in place as a redundant fallback layer, not deleted - same
  # defense-in-depth precedent already established for
  # fast-monitor-scheduler.yml. Overlapping triggers from both are safe:
  # cron-trigger's own per-user user_scan_lock treats a concurrent call
  # as an ordinary ScanAlreadyRunningError skip, not an error - see
  # backend/trigger_autonomous_scan.py's own module docstring.
  - type: cron
    name: plutotradeai-autonomous-scan-trigger
    runtime: python
    plan: starter
    schedule: "*/5 13-21 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/trigger_autonomous_scan.py
    envVars:
      - key: CRON_TRIGGER_URL
        value: https://plutotradeai-tqsl.onrender.com/api/autonomy/cron-trigger
      - key: CRON_SECRET
        sync: false
