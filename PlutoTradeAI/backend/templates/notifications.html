{% extends "base.html" %}
{% block content %}
<section class="glass-panel page-hero">
    <h2>Notification Center</h2>
    <p>Unread scanner, watchlist, account, and system alerts.</p>
</section>

<section class="glass-panel table-panel">
    <div class="inline-actions">
        <button type="button" id="notificationsMarkAll" class="btn-neutral">Mark All Read</button>
    </div>
    <div id="notificationsList" style="margin-top: 12px;">
        {% for alert in alerts %}
        <div class="alert-item" data-alert-id="{{ alert.id }}">
            <div>
                <b>{{ alert.type }}</b>
                <p>{{ alert.ticker }} {{ alert.message }}</p>
            </div>
            <button type="button" class="btn-neutral dismiss-alert" data-alert-id="{{ alert.id }}">Dismiss</button>
        </div>
        {% else %}
        <p>No active notifications.</p>
        {% endfor %}
    </div>
</section>
{% endblock %}
